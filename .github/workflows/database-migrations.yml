name: Production Database Migration Gate

on:
  push:
  pull_request:

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism_test_password
          POSTGRES_DB: prism_test_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism_test_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRISM_RUN_POSTGRES_MIGRATION_TESTS: "true"
      PRISM_TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=prism_test_migrations;Username=prism;Password=prism_test_password;Include Error Detail=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore frontend dependencies
        run: npm ci

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Verify immutable migration metadata
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~ApplicationDatabaseMigrationsTests|FullyQualifiedName~MediaLibraryMigrationMetadataTests"

      - name: Run PostgreSQL migration integration test
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~PostgresMigrationIntegrationTests

      - name: Run proliferation write-transaction PostgreSQL test
        # Creates, migrates and drops its own prism_test_prolif_* database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~ProliferationWritePostgresIntegrationTests

      - name: Run notification badge and retention PostgreSQL test
        # Priority ordering, unseen counts, seen-all and retention auto-read. Creates, migrates and
        # drops its own prism_test_notif_* database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~NotificationBadgeAndRetentionPostgresIntegrationTests

      - name: Run notification kind-compatibility PostgreSQL test
        # Rows with a notification kind from a newer release are skipped, not fatal. Creates,
        # migrates and drops its own prism_test_notifkind_* database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~NotificationKindCompatibilityPostgresIntegrationTests

      - name: Run notification query-cost PostgreSQL test
        # Round-trip budgets for the bell page and the unread/unseen counts. Creates, migrates and
        # drops its own prism_test_notifcost_* database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~NotificationQueryCostPostgresIntegrationTests

      - name: Run transactional notification outbox PostgreSQL test
        # Notifications commit with the change, roll back with it, and a failed notification
        # statement never aborts the business transaction. Creates, migrates and drops its own
        # prism_test_outbox_* database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~TransactionalNotificationQueuePostgresIntegrationTests

      - name: Run Document Repository PostgreSQL tests
        # OCR queue claims, delete-approval decisions and search snippets. Creates, migrates and
        # drops its own prism_test_docrepo_* databases on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~DocRepoPostgresIntegrationTests

      - name: Run Document Repository lists PostgreSQL test
        # Document types and offices: the xmin row version refuses stale changes, and delete
        # only removes unused values. Creates, migrates and drops its own prism_test_doclist_*
        # database on this server.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~DocRepoListPostgresIntegrationTests

      - name: Run PDF ingestion advisory-lock PostgreSQL test
        # One ingestion run at a time across application processes. Takes and releases a
        # session advisory lock only; it reads and writes no tables.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~PdfIngestionClusterLockTests

      - name: Run admin search escaping PostgreSQL test
        # A typed % or _ in an admin search matches itself, not any text. Creates, migrates and
        # drops its own prism_test_adminsearch_* database.
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~AdminSearchEscapingPostgresTests

      - name: Run Search V2 PostgreSQL integration tests
        env:
          # The tests create, migrate and drop their own prism_test_searchv2_* database
          # on this server, so they do not depend on the migration test's database state.
          PRISM_SEARCHV2_TEST_CONNECTION: "Host=localhost;Port=5432;Database=prism_test_migrations;Username=prism;Password=prism_test_password;Include Error Detail=true"
        run: >-
          dotnet test ProjectManagement.Tests/ProjectManagement.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~SearchV2PostgresIntegrationTests
