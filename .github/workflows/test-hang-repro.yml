# TEMPORARY: reproduces the intermittent test-host hang with dumps. Remove before merge.
name: Test hang repro

on:
  pull_request:
    branches:
      - master

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal" > test.log 2>&1 || (grep -E "Long Running|\[FAIL\]|Failed!|Passed!" test.log; exit 1)
      - if: always()
        run: grep -E "Long Running|\[FAIL\]|Failed!|Passed!" test.log | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.attempt }}
          path: test.log
          retention-days: 7
