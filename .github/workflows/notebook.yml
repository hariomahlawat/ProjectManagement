name: Notebook Build and Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore frontend dependencies
        run: npm ci

      - name: Run Notebook JavaScript tests
        run: npm test

      - name: Verify committed Notebook assets
        run: npm run check:notebook-assets

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # A test that runs for 90s (the in-process HttpClient gives up at 100s) is treated as
      # a hang: the test host is dumped and the hanging tests are named in Sequence.xml.
      - name: Test
        run: >-
          dotnet test --no-build
          --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type full
          --results-directory TestResults

      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence*.xml
          if-no-files-found: ignore
          retention-days: 7
