name: Lint Views

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure ripgrep
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Run view guardrails
        run: ./tools/check-views.sh
