name: Lint Views

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure ripgrep
        # The Ubuntu package servers are sometimes unreachable from the runner. When they are,
        # take the pinned release from GitHub instead and check it against its published checksum.
        run: |
          set -euo pipefail
          if command -v rg; then exit 0; fi
          if sudo apt-get update && sudo apt-get install -y ripgrep; then exit 0; fi
          echo "apt could not install ripgrep; using the pinned GitHub release."
          version=14.1.1
          archive="ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3             --output "${RUNNER_TEMP}/${archive}"             "https://github.com/BurntSushi/ripgrep/releases/download/${version}/${archive}"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/ripgrep-${version}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version
      - name: Run view guardrails
        run: ./tools/check-views.sh
      - name: Test view guardrails
        run: node --test tools/check-views.test.js
