openapi: 3.0.3
info:
  title: Project Management Remarks API
  version: "1.0.0"
  description: |
    Minimal-API endpoints for creating, listing, updating, soft-deleting and auditing project remarks.
    Source of truth: `Features/Remarks/RemarkApi.cs` (`RemarkApi.MapRemarkApi`) and
    `Services/Remarks/RemarkService.cs`. All routes require an authenticated user; `projectId` and
    `remarkId` are integer route constraints. Enums are serialised as strings
    (`JsonStringEnumConverter`; integer values are also accepted on input).

    Actor resolution (`RemarkApi.BuildActorContextAsync`): the caller's Identity roles are mapped
    to `RemarkActorRole` values. `ProjectOfficer` is kept only when the caller is the project's
    `LeadPoUserId`. For the read endpoints (list, audit) a caller with no mapped role falls back to
    a read-only viewer context, because every authenticated user may view projects
    (`ProjectAccessGuard.CanViewProject`). When `actorRole` is omitted the default is chosen in the
    order Commandant, HeadOfDepartment, Mco, ProjectOfficer, Ta, ProjectOffice, MainOffice,
    Administrator.

    Permission rules (`RemarkService`): External remarks require HoD, Comdt or Admin (or the
    FFC-only `Ito` actor). Conference remarks can be created, edited and deleted only by HoD or
    Comdt. Other remarks can be edited or deleted by HoD, Comdt or Admin at any time, and by the
    author within 3 hours of creation. Event dates may not be in the future (IST calendar date).
    The service does not check Repeat Build status for `TransferOfTechnology` scope; that rule is
    enforced only in the UI scope picker (`ProjectRemarksPanelService`).

    Note: these JSON endpoints do not validate an antiforgery token server-side. The client sends
    `X-CSRF-TOKEN`, but `RemarkApi` never calls `IAntiforgery.ValidateRequestAsync`. The
    `SameSite=Strict` auth cookie is the effective CSRF mitigation.
servers:
  - url: https://example.local
paths:
  /api/projects/{projectId}/remarks:
    post:
      summary: Create a remark
      description: >-
        For Conference remarks the supplied stage is ignored and the project's present stage
        (or "Completed") is recorded. For other types `stageRef` is optional; when supplied it must
        be a workflow stage code and, if the project has stage rows, one of the project's stages.
      operationId: createRemark
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemarkRequest'
      responses:
        '201':
          description: Remark created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remark'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      security:
        - cookieAuth: []
    get:
      summary: List remarks for a project
      operationId: listRemarks
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/RemarkType'
          description: Filter by remark type.
        - name: scope
          in: query
          schema:
            type: string
          description: >-
            Filter by remark scope. Accepts `General`, `TransferOfTechnology`, `ToT` (alias)
            or `all` (no filter).
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/RemarkActorRole'
          description: Filter by author role (Identity role names such as `HoD` or `Comdt` are also accepted).
        - name: stageRef
          in: query
          schema:
            type: string
          description: Filter by stage code; must be a stage of the project's workflow version, otherwise 400.
        - name: mine
          in: query
          schema:
            type: boolean
          description: When true, only remarks authored by the caller are returned. Defaults to false.
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Include remarks on or after this event date.
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Include remarks on or before this event date.
        - name: includeDeleted
          in: query
          schema:
            type: boolean
          description: Include soft-deleted remarks. Honoured only for Administrators and ignored for other roles. Defaults to false.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (defaults to 1).
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          description: Number of items per page (defaults to 20; values above 200 are clamped to 200).
        - name: actorRole
          in: query
          schema:
            $ref: '#/components/schemas/RemarkActorRole'
          description: Explicit acting role for the caller; must be one of the caller's mapped roles (403 otherwise).
      responses:
        '200':
          description: Paged remarks, newest first (by `createdAtUtc`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemarkList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - cookieAuth: []
  /api/projects/{projectId}/remarks/{remarkId}:
    put:
      summary: Update a remark
      operationId: updateRemark
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RemarkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRemarkRequest'
      responses:
        '200':
          description: Updated remark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remark'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      security:
        - cookieAuth: []
    delete:
      summary: Soft delete a remark
      operationId: deleteRemark
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RemarkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRemarkRequest'
      responses:
        '200':
          description: Deletion acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRemarkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      security:
        - cookieAuth: []
  /api/projects/{projectId}/remarks/{remarkId}/audit:
    get:
      summary: Retrieve remark audit history
      operationId: getRemarkAudit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RemarkId'
        - name: actorRole
          in: query
          schema:
            $ref: '#/components/schemas/RemarkActorRole'
          description: Acting role for the caller. The caller's role set must include Administrator, otherwise 403.
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RemarkAudit'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      security:
        - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-PMAuth
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
      description: Numeric project identifier.
    RemarkId:
      name: remarkId
      in: path
      required: true
      schema:
        type: integer
      description: Numeric remark identifier.
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: >-
        Caller is not authorised (ProblemDetails). Known drift: the service messages
        "External remarks require an authorised command or FFC role." and
        "Only Comdt or HoD may add conference remarks." are not mapped in
        `RemarkApi.MapServiceException`, so these denials currently return 400, not 403.
    NotFound:
      description: Resource not found
    Conflict:
      description: Request could not be completed due to a conflict (e.g. stale row version)
  schemas:
    RemarkType:
      type: string
      enum: [Internal, External, Conference]
    RemarkScope:
      type: string
      enum: [General, TransferOfTechnology]
      default: General
    RemarkActorRole:
      type: string
      enum:
        - ProjectOfficer
        - HeadOfDepartment
        - Commandant
        - Administrator
        - Ta
        - Mco
        - ProjectOffice
        - MainOffice
        - Ito
      description: >-
        `Ito` can appear in responses (FFC linked-project progress remarks) but is not accepted
        from API callers, because `RemarkActorRoleExtensions.TryParse` does not map it.
    Mention:
      type: object
      required: [userId, displayName, initials]
      properties:
        userId:
          type: string
        displayName:
          type: string
        initials:
          type: string
    Remark:
      type: object
      required: [id, projectId, type, scope, authorRole, authorUserId, authorDisplayName, authorInitials, body, eventDate, createdAtUtc, isDeleted, rowVersion, mentions]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          $ref: '#/components/schemas/RemarkType'
        scope:
          $ref: '#/components/schemas/RemarkScope'
        authorRole:
          $ref: '#/components/schemas/RemarkActorRole'
        authorUserId:
          type: string
        authorDisplayName:
          type: string
          description: Full name, user name, e-mail or user id (first available).
        authorInitials:
          type: string
        body:
          type: string
          description: Sanitised HTML; mentions are stored as placeholders.
        eventDate:
          type: string
          format: date
        stageRef:
          type: string
          nullable: true
        stageName:
          type: string
          nullable: true
        createdAtUtc:
          type: string
          format: date-time
        lastEditedAtUtc:
          type: string
          format: date-time
          nullable: true
        isDeleted:
          type: boolean
        deletedAtUtc:
          type: string
          format: date-time
          nullable: true
        deletedByUserId:
          type: string
          nullable: true
        deletedByRole:
          $ref: '#/components/schemas/RemarkActorRole'
          nullable: true
        deletedByDisplayName:
          type: string
          nullable: true
        rowVersion:
          type: string
          description: Base64 encoded concurrency token (empty string when absent).
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
    RemarkList:
      type: object
      required: [total, page, pageSize, items]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Remark'
    RemarkAudit:
      type: object
      required: [id, action, actorRole, actorUserId, actionAtUtc, snapshot]
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [Created, Edited, Deleted]
        actorRole:
          $ref: '#/components/schemas/RemarkActorRole'
        actorUserId:
          type: string
        actionAtUtc:
          type: string
          format: date-time
        meta:
          type: string
          nullable: true
        snapshot:
          $ref: '#/components/schemas/RemarkAuditSnapshot'
    RemarkAuditSnapshot:
      type: object
      required: [type, scope, authorRole, authorUserId, body, eventDate, createdAtUtc, isDeleted]
      properties:
        type:
          $ref: '#/components/schemas/RemarkType'
        scope:
          $ref: '#/components/schemas/RemarkScope'
        authorRole:
          $ref: '#/components/schemas/RemarkActorRole'
        authorUserId:
          type: string
        body:
          type: string
        eventDate:
          type: string
          format: date
        stageRef:
          type: string
          nullable: true
        stageName:
          type: string
          nullable: true
        createdAtUtc:
          type: string
          format: date-time
        lastEditedAtUtc:
          type: string
          format: date-time
          nullable: true
        isDeleted:
          type: boolean
        deletedAtUtc:
          type: string
          format: date-time
          nullable: true
        deletedByUserId:
          type: string
          nullable: true
        deletedByRole:
          $ref: '#/components/schemas/RemarkActorRole'
          nullable: true
    CreateRemarkRequest:
      type: object
      required: [type, body, eventDate]
      properties:
        type:
          $ref: '#/components/schemas/RemarkType'
        scope:
          $ref: '#/components/schemas/RemarkScope'
        body:
          type: string
        eventDate:
          type: string
          format: date
        stageRef:
          type: string
          nullable: true
        stageName:
          type: string
          nullable: true
        meta:
          type: string
          nullable: true
        actorRole:
          $ref: '#/components/schemas/RemarkActorRole'
          nullable: true
    UpdateRemarkRequest:
      type: object
      required: [body, eventDate, rowVersion]
      properties:
        scope:
          $ref: '#/components/schemas/RemarkScope'
          description: Defaults to General when omitted.
        body:
          type: string
        eventDate:
          type: string
          format: date
        stageRef:
          type: string
          nullable: true
        stageName:
          type: string
          nullable: true
        meta:
          type: string
          nullable: true
        rowVersion:
          type: string
          description: Base64 encoded concurrency token.
        actorRole:
          $ref: '#/components/schemas/RemarkActorRole'
          nullable: true
    DeleteRemarkRequest:
      type: object
      required: [rowVersion]
      properties:
        rowVersion:
          type: string
          description: Base64 encoded concurrency token.
        meta:
          type: string
          nullable: true
        actorRole:
          $ref: '#/components/schemas/RemarkActorRole'
          nullable: true
    DeleteRemarkResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        rowVersion:
          type: string
          nullable: true
          description: Latest row version for the tombstone.
